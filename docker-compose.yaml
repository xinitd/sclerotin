x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  app:
    build: .
    restart: unless-stopped
    environment:
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
    networks:
      - internal_network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEM_LIMIT:-256m}
    cpus: ${APP_CPUS:-0.5}
    pids_limit: 50
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ping', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  webserver:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
        # Nginx resolves "app" only at startup: without this, a recreated app (new IP) means 502s
        restart: true
    networks:
      - internal_network
      - public_network
    volumes:
      - ./webserver/default.conf:/etc/nginx/conf.d/default.conf:ro
      # A missing certificate stops Compose; the short syntax would create directories instead
      - type: bind
        source: ./webserver/fullchain.pem
        target: /etc/ssl/certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./webserver/privkey.pem
        target: /etc/ssl/private/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /run
      # Counts against mem_limit: without a cap, slow clients could get Nginx OOM-killed
      - /var/cache/nginx:size=16m
    # The root master chowns its temp dirs and drops workers to the nginx user.
    # No NET_BIND_SERVICE: Docker sets ip_unprivileged_port_start=0, so 80/443 bind without it
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WEBSERVER_MEM_LIMIT:-128m}
    cpus: ${WEBSERVER_CPUS:-0.5}
    pids_limit: 50
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'

networks:
  # No route outside: a compromised app can't fetch a payload or send data out
  internal_network:
    internal: true

  # Nginx only: an internal network can't carry published ports. Without enable_ipv6,
  # IPv6 clients arrive from the gateway address and share one rate-limit bucket
  public_network:
    enable_ipv6: true
