version: 2
updates:

  # Monthly, in one pull request. Security fixes don't wait for it: Dependabot
  # security updates open them as soon as an alert is raised
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pip:
        applies-to: version-updates
        patterns:
          - "*"

  # Every day of the first week: Dependabot waits until a build is three days old,
  # and official images are rebuilt every few days, so a single monthly check could
  # skip the month. Images get no security updates, so this is their only channel
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1-7 * *"

  # Same schedule for the same reason
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1-7 * *"

  # Same as pip
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
