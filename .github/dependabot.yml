version: 2
updates:

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # Daily: Dependabot waits three days after a tag is pushed, and official images
  # are rebuilt every few days, so a weekly check could keep missing the window
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  # Daily for the same reason
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
