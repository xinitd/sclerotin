name: CI

# No path filters: once this check is required in the ruleset, a pull request
# that doesn't trigger it would wait for it forever
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Each push to main
# gets a group of its own: a merge must not cancel the run of the commit before it
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:

  pinned-dependencies:
    name: Pinned dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the app image
        run: docker build --pull --tag sclerotin-app:ci .

      # Dependabot changes only the line of the package it updates: a release that
      # brings in a new dependency would be installed unpinned without this check
      - name: Compare the image with requirements.txt
        run: |
          docker run --rm --network none sclerotin-app:ci \
            pip freeze --exclude pydantic-core > installed.txt
          if ! diff -u requirements.txt installed.txt; then
            echo "::error file=requirements.txt::requirements.txt doesn't match the packages installed in the image. Apply the diff above to requirements.txt."
            exit 1
          fi

      - name: Check installed packages for conflicts
        run: docker run --rm --network none sclerotin-app:ci pip check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ruff is pinned in requirements-dev.txt, where Dependabot updates it
      - name: Install ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run ruff
        run: ruff check --output-format=github .

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Python of the Dockerfile's base image
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install the dev tools
        run: pip install --no-cache-dir -r requirements-dev.txt

      # main.py is small, so every branch of it is tested: a new one without a test fails here
      - name: Run the tests with branch coverage
        run: |
          coverage run --branch --source=main -m pytest
          coverage report --show-missing --fail-under=100
