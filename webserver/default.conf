# At http level, not in the 443 server: port 80 needs these too, and Nginx takes TLS
# session resumption and the handshake timeout from the default servers

server_tokens off;

# Mozilla "intermediate", guidelines 6.0. No ssl_ecdh_curve: the OpenSSL default
# already includes post-quantum X25519MLKEM768
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Against slow clients and oversized requests
client_max_body_size 1m;
client_body_buffer_size 16k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k; # long cookies and JWTs; smaller values risk 400/414

client_body_timeout 12;
client_header_timeout 12;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# App headers for Nginx's own responses (429, 413, 502, 504): a map yields nothing when
# upstream sent the header, and add_header skips empty values. Keep in sync with main.py
map $upstream_http_content_security_policy $fallback_csp {
    "" "default-src 'none'; frame-ancestors 'none'";
}

map $upstream_http_x_content_type_options $fallback_nosniff {
    "" nosniff;
}

map $upstream_http_permissions_policy $fallback_permissions_policy {
    "" "geolocation=(), microphone=(), camera=(), payment=(), usb=()";
}

# public_network has IPv6, so every server listens on [::] too, or IPv6 clients get no answer

# Unknown hosts and bare IPs (scanners): no response, and no certificate shown
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;

    # Plain HTTP on port 443 gets a 400 page before "return" runs; this drops it as well
    error_page 497 /;

    # A request with a valid SNI and a foreign Host header lands here, past
    # ssl_reject_handshake. Over HTTP/2 Nginx answers 421 before this point
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name sclerotin.args.tech localhost; # localhost for local testing

    # Per server: the image's nginx.conf already sets it at http level
    keepalive_timeout 15;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sclerotin.args.tech localhost; # localhost for local testing

    # Mounted by docker-compose.yaml from webserver/*.pem
    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    keepalive_timeout 15;

    # No preload: hstspreload.org accepts only apex domains
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # See the maps at the top
    add_header Content-Security-Policy $fallback_csp always;
    add_header X-Content-Type-Options $fallback_nosniff always;
    add_header Permissions-Policy $fallback_permissions_policy always;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        # Overwrite rather than append: Uvicorn with --forwarded-allow-ips='*' takes
        # the leftmost address, so a client-supplied X-Forwarded-For would spoof its IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
